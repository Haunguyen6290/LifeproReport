name: Sync to MAST_Report
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAST_SYNC_TOKEN }}
      - name: Push to thanhhau90/MAST_Report
        run: |
          git remote add mast https://x-access-token:${{ secrets.MAST_SYNC_TOKEN }}@github.com/thanhhau90/MAST_Report.git
          git push mast main
